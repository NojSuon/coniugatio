<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <base href="{{base}}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <script>
    // Light or dark theme before the first paint: the saved choice, else light.
    document.documentElement.dataset.theme = "light";
    try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
  <title>{{title}} · Mati Mati</title>
  <link rel="icon" href="static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;700;800&family=Noto+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="static/css/mati.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  <header class="site-header" data-site-header></header>
  <main id="contenido" data-language-root data-slug="{{slug}}">
    <div class="section"><div class="wrap"><p class="caption">Cargando…</p></div></div>
  </main>
  <footer class="site-footer" data-site-footer></footer>
  <script type="module" src="static/js/language.js"></script>
</body>
</html>
