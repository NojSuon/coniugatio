[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm", "crates/site"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
coniugatio-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
