[package]
name = "coniugatio"
version = "0.1.0"
edition = "2021"
description = "Mati Mati verb conjugator for indigenous languages"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
